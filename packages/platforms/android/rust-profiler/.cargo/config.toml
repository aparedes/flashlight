# The Android binaries are fully static musl builds, linked with the
# rust-lld shipped in the Rust toolchain: no Android NDK is needed.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

[target.armv7-unknown-linux-musleabihf]
linker = "rust-lld"

[target.i686-unknown-linux-musl]
linker = "rust-lld"

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
