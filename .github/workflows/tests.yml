name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "**/main"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint

  typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Workspace packages resolve each other through their built `dist/`, so the unit
      # suite needs a build first (verified locally: it fails with "Cannot find module" otherwise).
      - name: Build
        run: bun run build
      - name: Run unit tests
        run: bun run test:unit

  rust-profiler:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/platforms/android/rust-profiler
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # The committed bin/ binary is a static musl build — verify the
      # cross-compilation setup keeps working (no NDK needed, only rustup targets)
      - name: Cross-compile the supported Android ABI
        run: ./build_all_abi.sh

  rust-profiler-ios:
    # The iOS profiler runs on the Mac (usbmuxd/CoreDevice tunnel), so build it where it ships.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: packages/platforms/ios/rust-profiler
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # The committed bin/ binary (arm64 only) is embedded by build:standalone — verify it
      # still builds from the checked-in source.
      - name: Build the macOS binary
        run: ./build_macos.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Informational: surface findings as a warning annotation instead of a red job —
      # most findings live under transitive dev tooling and are tracked, not blocking.
      - name: Audit dependencies
        run: bun audit || echo "::warning::bun audit found vulnerabilities — see this job's log"
